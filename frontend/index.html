<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thin Client Recommendations</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: #161b22;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 300px;
            vertical-align: top;
        }
        .button {
            background-color: #58a6ff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .email-section {
            margin-top: 30px;
            text-align: center;
        }
        input[type="email"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #58a6ff;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Thin Client Recommendations</h1>
        <p>Obtén recomendaciones personalizadas para optimizar tu infraestructura de TI.</p>
    </header>
    <div id="thinClientsContainer"></div>
    <div class="email-section">
        <h2>¿Te interesa este producto?</h2>
        <input type="email" id="emailInput" placeholder="Tu email" required>
        <button class="button" id="subscribeButton">Quiero acceso anticipado</button>
        <p id="waitlistCount"></p>
    </div>
    <script>
        async function fetchThinClients() {
            try {
                const response = await fetch('/thin_clients');
                const data = await response.json();
                displayThinClients(data);
            } catch (error) {
                console.error('Error fetching thin clients:', error);
            }
        }

        function displayThinClients(clients) {
            const container = document.getElementById('thinClientsContainer');
            container.innerHTML = '';
            clients.forEach(client => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 style="color:#58a6ff;margin:0 0 6px">${client.modelo || client.name || "Sin nombre"}</h3>
                    <p style="color:#8b949e;font-size:12px;margin:0 0 8px">${client.marca || client.brand || ""} · ${client.categoria || client.category || ""}</p>
                    <p style="font-size:13px;margin:4px 0"><strong>RAM:</strong> ${client.ram || "—"} · <strong>Almacenamiento:</strong> ${client.almacenamiento || client.storage || "—"}</p>
                    <p style="font-size:13px;margin:4px 0"><strong>Precio:</strong> $${client.precio_usd || client.price || "—"} USD</p>
                    <p style="font-size:12px;color:#8b949e;margin-top:8px">${client.descripcion || client.description || ""}</p>
                    <button class="button" style="margin-top:10px;width:100%" onclick="selectClient(${client.id})">Ver detalles</button>
                `;
                container.appendChild(card);
            });
        }

        async function fetchWaitlistCount() {
            try {
                const response = await fetch('/waitlist/count');
                const data = await response.json();
                document.getElementById('waitlistCount').innerText = `${data.count} personas ya están en la lista.`;
            } catch (error) {
                console.error('Error fetching waitlist count:', error);
            }
        }

        document.getElementById('subscribeButton').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            if (email) {
                try {
                    await fetch('/waitlist', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });
                    alert('¡Anotado! Te avisamos cuando lancemos.');
                    fetchWaitlistCount();
                } catch (error) {
                    console.error('Error subscribing to waitlist:', error);
                }
            } else {
                alert('Por favor, ingresa un email válido.');
            }
        });

        function selectClient(clientId) {
            fetch(`/thin_clients/${clientId}`)
                .then(response => response.json())
                .then(client => {
                    alert(`Has seleccionado: ${client.modelo || client.name || ""}`);
                })
                .catch(error => console.error('Error fetching client details:', error));
        }

        fetchThinClients();
        fetchWaitlistCount();
    </script>
</body>
</html>
